name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node-version:
          - '22.x'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run standard validation
        run: npm run check

      - name: Build package
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Upload process-test diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: process-test-diagnostics-${{ matrix.os }}
          path: |
            test-results/process/
            tests/process/artifacts/
            process-test-artifacts/
            ${{ runner.temp }}/pi-to-pi-process-tests/
          if-no-files-found: ignore
